<script>
const STRUCTURE_URLS = [
  './structure.xlsx',
  'structure.xlsx',
  './Structure.xlsx',
  './Структура.xlsx',
  './%D0%A1%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B0.xlsx',
  'Структура.xlsx'
];

const emptyFilters = () => ({
  dateStart: null, dateEnd: null, curator: 'ALL', departmentHead: 'ALL', department: 'ALL',
  responsible: 'ALL', deadlineCategory: 'ALL', status: 'ALL', appealType: 'ALL',
  applicant: 'ALL', correspondent: 'ALL', searchQuery: '', tab: null, periodPreset: 'ALL'
});

const state = {
  protocols: [], eOtinish: [], incoming: [],
  structure: [],
  meta: { protocols:null, eOtinish:null, incoming:null, structure:null },
  referenceDate: startOfDay(new Date()),
  activePage: 'overview',
  selectedMetric: null,
  selectedRecord: null,
  filters: emptyFilters(),
  dataLoaded: false,
  lastValidation: null
};

function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function normalizeText(v){ if(v==null) return ''; return String(v).replace(/\u00A0/g,' ').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim(); }
function isMissing(v){ const s=normalizeText(v); return !s || s==='-' || /^null|undefined$/i.test(s); }
function normalizePersonName(v){
  let s=normalizeText(v).toLowerCase().replace(/ё/g,'е');
  s=s.replace(/[«»"']/g,'').replace(/,/g,' ');
  s=s.replace(/\./g,'.').replace(/\s+/g,' ').trim();
  return s;
}
function initialsKey(full){
  const p=normalizePersonName(full).split(' ').filter(Boolean);
  if(!p.length) return '';
  const sur=p[0];
  const ini=p.slice(1).map(x=>x.replace(/\./g,'')[0]||'').join('');
  return sur+' '+ini;
}
function extractPersonCandidates(raw){
  const text=normalizeText(raw);
  if(!text) return [];
  const parts=text.split(/[,;/\n]| и |\/|\t/).map(normalizeText).filter(Boolean);
  const out=[];
  const re=/(?:^|\s)([А-ЯЁӘІҢҒҮҰҚӨҺA-Z][а-яёәіңғүұқөһa-z\-]+)\s+([А-ЯЁӘІҢҒҮҰҚӨҺA-Z]\.?\s*[А-ЯЁӘІҢҒҮҰҚӨҺA-Z]\.?)/g;
  const re2=/(?:^|\s)([А-ЯЁӘІҢҒҮҰҚӨҺA-Z][а-яёәіңғүұқөһa-z\-]+)\s+([А-ЯЁӘІҢҒҮҰҚӨҺA-Z][а-яёәіңғүұқөһa-z\-]+)\s+([А-ЯЁӘІҢҒҮҰҚӨҺA-Z][а-яёәіңғүұқөһa-z\-]+)/g;
  for(const chunk of [text,...parts]){
    let m; const r1=new RegExp(re); while((m=r1.exec(chunk))) out.push(m[1]+' '+m[2].replace(/\s+/g,''));
    const r2=new RegExp(re2); while((m=r2.exec(chunk))) out.push(m[1]+' '+m[2]+' '+m[3]);
    if(/[А-ЯЁӘІҢҒҮҰҚӨҺA-Z][а-яёәіңғүұқөһa-z]{2,}/.test(chunk) && chunk.split(' ').length<=5) out.push(chunk);
  }
  return [...new Set(out.map(normalizeText).filter(x=>x.length>=3))];
}
function parseFlexibleDate(v){
  if(v==null || v==='' || v==='-') return null;
  if(v instanceof Date && !isNaN(v.getTime())) return startOfDay(v);
  if(typeof v==='object' && v.type==='text') return v;
  if(typeof v==='number' && isFinite(v)){
    if(typeof XLSX!=='undefined' && XLSX.SSF && XLSX.SSF.parse_date_code){
      const d=XLSX.SSF.parse_date_code(v);
      if(d) return new Date(d.y, d.m-1, d.d);
    }
    const epoch=new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(epoch)) return startOfDay(epoch);
  }
  const s=normalizeText(String(v));
  const low=s.toLowerCase();
  if(/постоянн|еженедельн|на постоянной|ежемесяч|ежекварт/.test(low)) return {type:'text', value:s};
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const dt=new Date(s);
  if(!isNaN(dt.getTime()) && /\d{4}/.test(s)) return startOfDay(dt);
  return null;
}
function daysBetween(deadline, ref){
  if(!deadline || deadline.type==='text' || !(deadline instanceof Date) || !(ref instanceof Date)) return null;
  return Math.round((startOfDay(deadline)-startOfDay(ref))/86400000);
}
function formatDate(d){
  if(!d) return '—';
  if(d.type==='text') return d.value;
  if(!(d instanceof Date) || isNaN(d)) return '—';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function normalizeProtocolStatus(raw){
  const s=normalizeText(raw).toLowerCase();
  if(!s) return 'Не определено';
  if(/на\s*снят/.test(s) || /снятий/.test(s)) return 'На снятии с контроля';
  if(/просроч/.test(s)) return 'Просрочено';
  if(/рабочий\s*контроль/.test(s)) return 'Рабочий контроль';
  if(/снят|снято/.test(s)) return 'Снят с контроля';
  if(/^в\s*работе$/.test(s) || s==='в работе') return 'В работе';
  if(/в\s*работе/.test(s)) return 'В работе';
  return 'Не определено';
}
function normalizeIncomingStatus(raw){
  const s=normalizeText(raw).toLowerCase();
  if(!s) return 'Не определено';
  if(/на\s*исполнен/.test(s)) return 'На исполнении';
  if(/не\s*исполн/.test(s)) return 'Не исполнено';
  if(/выполнен/.test(s) || /^исполнен/.test(s) || s==='исполнено') return 'Выполнено';
  return raw || 'Не определено';
}
function normalizeEStatus(raw){
  const s=normalizeText(raw).toLowerCase();
  if(/заверш/.test(s)) return 'Завершено';
  if(/на\s*исполнен/.test(s)) return 'На исполнении';
  return raw || 'Не определено';
}

function mapEmployeeToStructure(nameRaw, structure){
  const fallback={department:'Не определено',departmentHead:'Не определено',curator:'Не определено'};
  if(isMissing(nameRaw) || !structure.length) return fallback;
  const candidates=extractPersonCandidates(nameRaw);
  const tryList=candidates.length?candidates:[normalizeText(nameRaw)];
  for(const cand of tryList){
    const n=normalizePersonName(cand);
    let match=structure.find(e=>normalizePersonName(e.employeeName)===n);
    if(match) return fillEnrich(match);
    const ik=initialsKey(cand);
    const hits=structure.filter(e=>initialsKey(e.employeeName)===ik && ik);
    if(hits.length===1) return fillEnrich(hits[0]);
    const sur=n.split(' ')[0];
    if(sur && sur.length>3){
      const bySur=structure.filter(e=>normalizePersonName(e.employeeName).split(' ')[0]===sur);
      if(bySur.length===1) return fillEnrich(bySur[0]);
    }
  }
  return fallback;
}
function fillEnrich(m){
  return {
    department: m.department || 'Не определено',
    departmentHead: m.departmentHead || 'Не определено',
    curator: m.curator || 'Не определено'
  };
}

function findHeaderRow(rows, required, maxScan=20){
  let best={score:0,idx:-1};
  for(let i=0;i<Math.min(maxScan,rows.length);i++){
    const row=rows[i].map(c=>normalizeText(c).toLowerCase());
    let score=0;
    for(const h of required){
      const hl=h.toLowerCase();
      if(row.some(c=>c && (c.includes(hl)||hl.includes(c)))) score++;
    }
    if(score>best.score) best={score,idx:i};
  }
  return best.score>=Math.ceil(required.length*0.45)?best.idx:-1;
}

function parseStructure(wb){
  const sheetName=wb.SheetNames.find(n=>/ца/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
  let dataStart=0;
  for(let i=0;i<Math.min(12,rows.length);i++){
    const r=rows[i].map(c=>normalizeText(c).toLowerCase());
    if(r.some(c=>c.includes('ф.и.о')||c.includes('фио'))){
      dataStart=i+1;
      if(rows[i+1] && rows[i+1].some(c=>/наименование|руководитель/i.test(String(c)))) dataStart=i+2;
      break;
    }
  }
  const employees=[];
  for(let i=dataStart;i<rows.length;i++){
    const name=normalizeText(rows[i][0]);
    if(!name || name.length<3) continue;
    employees.push({
      employeeName:name,
      employeePosition:normalizeText(rows[i][1]),
      department:normalizeText(rows[i][2]),
      curator:normalizeText(rows[i][3]),
      departmentHead:normalizeText(rows[i][4]),
      departmentDecode:normalizeText(rows[i][5]||'')
    });
  }
  if(employees.length<5) throw new Error('В структуре слишком мало сотрудников');
  return {employees,sheetName,validCount:employees.length};
}

function parseProtocols(wb, structure){
  const sheetName=wb.SheetNames.find(n=>/протокол/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:false});
  const headerIdx=findHeaderRow(rows,['№ Протокола','№ поручения','Содержание','Сроки','Контроль']);
  if(headerIdx<0) throw new Error('Не найден заголовок таблицы протоколов');
  const headers=rows[headerIdx].map(h=>normalizeText(h));
  const col=name=>headers.findIndex(h=>h.toLowerCase().includes(name.toLowerCase()));
  const cProtocol=col('протокол'), cNum=col('поручения'), cText=col('содержание');
  const cResp=col('руководители')>=0?col('руководители'):col('ответственн');
  const cDeadline=col('сроки')>=0?col('сроки'):col('срок');
  const cExec=col('статус исполнения'), cFurther=col('дальнейший'), cControl=headers.length-1;
  const records=[]; let ignored=0;
  const rawRows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true});
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i], raw=rawRows[i]||r;
    const protocolRaw=normalizeText(r[cProtocol]);
    const assignNum=normalizeText(r[cNum]);
    const text=normalizeText(r[cText]);
    if(!assignNum && !text){ ignored++; continue; }
    const deadlineVal=cDeadline>=0?(raw[cDeadline]!==''&&raw[cDeadline]!=null?raw[cDeadline]:r[cDeadline]):'';
    const deadlineParsed=parseFlexibleDate(deadlineVal);
    const controlRaw=cControl>=0?normalizeText(r[cControl]):'';
    const controlNorm=normalizeProtocolStatus(controlRaw);
    const respRaw=cResp>=0?normalizeText(r[cResp]):'';
    const persons=extractPersonCandidates(respRaw);
    const primary=persons[0]||respRaw;
    const enrich=mapEmployeeToStructure(primary, structure);
    let isOverdue=false;
    if(controlNorm==='Просрочено') isOverdue=true;
    else if(controlNorm!=='Снят с контроля' && deadlineParsed && deadlineParsed instanceof Date){
      if(deadlineParsed<state.referenceDate) isOverdue=true;
    }
    records.push({
      id:'p-'+i, sourceFile:'1.xlsx', sourceSheet:sheetName, sourceRow:i+1,
      protocol:protocolRaw, assignmentNumber:assignNum, assignmentText:text,
      responsibleRaw:respRaw, responsiblePersons:persons.length?persons:[respRaw].filter(Boolean),
      deadlineRaw:normalizeText(deadlineVal), deadlineDate:deadlineParsed,
      executionStatusRaw:cExec>=0?normalizeText(r[cExec]):'',
      furtherControl:cFurther>=0?normalizeText(r[cFurther]):'',
      controlStatusRaw:controlRaw, controlStatusNormalized:controlNorm, isOverdue,
      department:enrich.department, departmentHead:enrich.departmentHead, curator:enrich.curator
    });
  }
  if(!records.length) throw new Error('Не найдено ни одного поручения');
  return {records,sheetName,validCount:records.length,ignoredCount:ignored};
}

function parseEOtinish(wb, structure){
  const sheetName=wb.SheetNames.find(n=>/report/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:false});
  const rawRows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true});
  const headerIdx=findHeaderRow(rows,['Номер обращения','Дата регистрации','Автор','Статус исполнения']);
  if(headerIdx<0) throw new Error('Не найден заголовок таблицы e-Өтініш');
  const headers=rows[headerIdx].map(h=>normalizeText(h));
  const col=name=>headers.findIndex(h=>h.toLowerCase().includes(name.toLowerCase()));
  const cNum=col('номер обращения'), cReg=col('дата регистрации'), cAuthor=col('автор');
  const cType=col('вид обращения'), cSummary=col('краткое содержание');
  const cDeadline=col('срок исполнения'), cDays=col('осталось дней');
  const cRespDate=col('дата предоставления'), cStatus=col('статус исполнения');
  const cResp=col('ответственный исполнитель'), cDept=col('структурное подразделение');
  const records=[]; let ignored=0;
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i], raw=rawRows[i]||r;
    const num=normalizeText(r[cNum]);
    if(!num){ ignored++; continue; }
    const statusRaw=normalizeText(r[cStatus]);
    const statusNorm=normalizeEStatus(statusRaw);
    let daysRem=null;
    if(cDays>=0 && !isMissing(r[cDays])){ const d=Number(String(r[cDays]).replace(',','.')); if(!isNaN(d)) daysRem=d; }
    const deadline=parseFlexibleDate(cDeadline>=0?(raw[cDeadline]||r[cDeadline]):'');
    if(daysRem==null && deadline instanceof Date) daysRem=daysBetween(deadline, state.referenceDate);
    const resp=normalizeText(r[cResp]);
    const enrich=mapEmployeeToStructure(resp, structure);
    records.push({
      id:'e-'+i, sourceFile:'2.xlsx', sourceSheet:sheetName, sourceRow:i+1,
      appealNumber:num, registrationDate:parseFlexibleDate(cReg>=0?(raw[cReg]||r[cReg]):''),
      applicant:normalizeText(r[cAuthor]), appealType:normalizeText(r[cType]),
      summary:normalizeText(r[cSummary]), deadline, daysRemaining:daysRem,
      responseDate:parseFlexibleDate(cRespDate>=0?(raw[cRespDate]||r[cRespDate]):''),
      executionStatusRaw:statusRaw, executionStatusNormalized:statusNorm,
      responsibleEmployee:resp, department:normalizeText(r[cDept])||enrich.department,
      departmentHead:enrich.departmentHead, curator:enrich.curator
    });
  }
  if(!records.length) throw new Error('Не найдено обращений');
  return {records,sheetName,validCount:records.length,ignoredCount:ignored};
}

function parseIncoming(wb, structure){
  const sheetName=wb.SheetNames.find(n=>/напомин/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:false});
  const rawRows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true});
  const headerIdx=findHeaderRow(rows,['№ п.п.','Рег. номер','Корреспондент','Статус исполнения']);
  if(headerIdx<0) throw new Error('Не найден заголовок таблицы входящих');
  const headers=rows[headerIdx].map(h=>normalizeText(h));
  const col=name=>headers.findIndex(h=>h.toLowerCase().includes(name.toLowerCase()));
  const cReg=col('рег. номер'), cExt=col('исх'), cCorr=col('корреспондент'), cSum=col('краткое содержание');
  const cResp=col('ответственный'), cDept=col('подразделение');
  const cDeadline=col('срок исполнения'), cDays=col('осталось')>=0?col('осталось'):col('просрочено');
  const cExtDead=col('внешний срок'), cStatus=col('статус исполнения');
  const records=[]; let ignored=0;
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i], raw=rawRows[i]||r;
    const reg=normalizeText(r[cReg]);
    if(!reg){ ignored++; continue; }
    const statusRaw=normalizeText(r[cStatus]);
    const statusNorm=normalizeIncomingStatus(statusRaw);
    let daysRem=null;
    if(cDays>=0 && !isMissing(r[cDays])){ const d=Number(String(r[cDays]).replace(/[^\d\-]/g,'')); if(!isNaN(d)) daysRem=d; }
    const deadline=parseFlexibleDate(cDeadline>=0?(raw[cDeadline]||r[cDeadline]):'');
    if(daysRem==null && deadline instanceof Date) daysRem=daysBetween(deadline, state.referenceDate);
    const resp=normalizeText(r[cResp]);
    const enrich=mapEmployeeToStructure(resp, structure);
    records.push({
      id:'i-'+i, sourceFile:'3.xlsx', sourceSheet:sheetName, sourceRow:i+1,
      registrationNumberAndDate:reg, externalNumberDate:normalizeText(r[cExt]),
      correspondent:normalizeText(r[cCorr]), summary:normalizeText(r[cSum]),
      responsibleEmployee:resp, department:normalizeText(r[cDept])||enrich.department,
      deadline, daysRemaining:daysRem, externalDeadline:parseFlexibleDate(cExtDead>=0?(raw[cExtDead]||r[cExtDead]):''),
      executionStatusRaw:statusRaw, executionStatusNormalized:statusNorm,
      departmentHead:enrich.departmentHead, curator:enrich.curator
    });
  }
  if(!records.length) throw new Error('Не найдено входящих документов');
  return {records,sheetName,validCount:records.length,ignoredCount:ignored};
}

function deadlineCategoryOf(deadline, daysRem){
  if(daysRem!=null){
    if(daysRem<0) return 'overdue';
    if(daysRem===0) return 'today';
    if(daysRem<=3) return 'd13';
    if(daysRem<=7) return 'd47';
    if(daysRem<=30) return 'd830';
    return 'd30p';
  }
  if(deadline && deadline instanceof Date){
    const d=daysBetween(deadline, state.referenceDate);
    return deadlineCategoryOf(deadline, d);
  }
  return 'none';
}

function applyCommonFilters(records, type){
  const f=state.filters;
  return records.filter(r=>{
    if(f.curator!=='ALL' && normalizeText(r.curator)!==f.curator) return false;
    if(f.departmentHead!=='ALL' && normalizeText(r.departmentHead)!==f.departmentHead) return false;
    if(f.department!=='ALL' && normalizeText(r.department)!==f.department) return false;
    if(f.responsible!=='ALL'){
      const bag=type==='protocol'?[r.responsibleRaw,...(r.responsiblePersons||[])]:[r.responsibleEmployee];
      if(!bag.some(p=>normalizeText(p).toLowerCase().includes(f.responsible.toLowerCase()))) return false;
    }
    if(f.correspondent!=='ALL' && type==='incoming' && normalizeText(r.correspondent)!==f.correspondent) return false;
    if(f.applicant!=='ALL' && type==='eotinish' && normalizeText(r.applicant)!==f.applicant) return false;
    if(f.appealType!=='ALL' && type==='eotinish' && normalizeText(r.appealType)!==f.appealType) return false;
    if(f.status!=='ALL'){
      const st=type==='protocol'?r.controlStatusNormalized:r.executionStatusNormalized;
      if(st!==f.status) return false;
    }
    const dateField=type==='eotinish'?r.registrationDate:r.deadlineDate||r.deadline;
    if(f.dateStart && dateField instanceof Date && dateField<new Date(f.dateStart)) return false;
    if(f.dateEnd && dateField instanceof Date && dateField>new Date(f.dateEnd+'T23:59:59')) return false;
    if(f.deadlineCategory!=='ALL'){
      const days=r.daysRemaining!=null?r.daysRemaining:daysBetween(r.deadlineDate||r.deadline, state.referenceDate);
      if(deadlineCategoryOf(r.deadlineDate||r.deadline, days)!==f.deadlineCategory) return false;
    }
    if(f.searchQuery){
      const q=f.searchQuery.toLowerCase();
      const hay=(type==='protocol'
        ?[r.protocol,r.assignmentNumber,r.assignmentText,r.responsibleRaw,r.department]
        :type==='eotinish'
        ?[r.appealNumber,r.applicant,r.appealType,r.summary,r.responsibleEmployee,r.department]
        :[r.registrationNumberAndDate,r.externalNumberDate,r.correspondent,r.summary,r.responsibleEmployee,r.department]
      ).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function isProtoOverdue(r){ return r.controlStatusNormalized==='Просрочено' || (!!r.isOverdue && r.controlStatusNormalized!=='Снят с контроля'); }
function isEOverdue(r){ return r.executionStatusNormalized==='На исполнении' && r.daysRemaining!=null && r.daysRemaining<0; }
function isEDue7(r){ return r.executionStatusNormalized==='На исполнении' && r.daysRemaining!=null && r.daysRemaining>=0 && r.daysRemaining<=7; }
function isIncUnfinished(r){ return r.executionStatusNormalized==='Не исполнено' || r.executionStatusNormalized==='На исполнении'; }
function isIOverdue(r){ return isIncUnfinished(r) && r.daysRemaining!=null && r.daysRemaining<0; }
function isIDue7(r){ return isIncUnfinished(r) && r.daysRemaining!=null && r.daysRemaining>=0 && r.daysRemaining<=7; }

function getProtocolKPIs(list){
  return {
    total:list.length,
    overdue:list.filter(isProtoOverdue).length,
    inWork:list.filter(r=>r.controlStatusNormalized==='В работе').length,
    working:list.filter(r=>r.controlStatusNormalized==='Рабочий контроль').length,
    pending:list.filter(r=>r.controlStatusNormalized==='На снятии с контроля').length,
    removed:list.filter(r=>r.controlStatusNormalized==='Снят с контроля').length
  };
}
function getEOtinishKPIs(list){
  return {
    total:list.length,
    overdue:list.filter(isEOverdue).length,
    due7:list.filter(isEDue7).length,
    done:list.filter(r=>r.executionStatusNormalized==='Завершено').length,
    inWork:list.filter(r=>r.executionStatusNormalized==='На исполнении').length
  };
}
function getIncomingKPIs(list){
  return {
    total:list.length,
    overdue:list.filter(isIOverdue).length,
    due7:list.filter(isIDue7).length,
    done:list.filter(r=>r.executionStatusNormalized==='Выполнено').length,
    inWork:list.filter(isIncUnfinished).length
  };
}

function applyMetricAndTab(list, type){
  let out=list;
  const m=state.selectedMetric;
  if(type==='protocol'){
    if(m==='p-overdue') out=out.filter(isProtoOverdue);
    else if(m==='p-inwork') out=out.filter(r=>r.controlStatusNormalized==='В работе');
    else if(m==='p-working') out=out.filter(r=>r.controlStatusNormalized==='Рабочий контроль');
    else if(m==='p-pending') out=out.filter(r=>r.controlStatusNormalized==='На снятии с контроля');
    else if(m==='p-removed') out=out.filter(r=>r.controlStatusNormalized==='Снят с контроля');
  } else if(type==='eotinish'){
    if(m==='e-overdue') out=out.filter(isEOverdue);
    else if(m==='e-due7') out=out.filter(isEDue7);
    else if(m==='e-done') out=out.filter(r=>r.executionStatusNormalized==='Завершено');
    const tab=state.filters.tab || (state.activePage==='eotinish' && !m ? 'active' : null);
    if(tab==='active') out=out.filter(r=>r.executionStatusNormalized==='На исполнении');
    else if(tab==='overdue') out=out.filter(isEOverdue);
    else if(tab==='done') out=out.filter(r=>r.executionStatusNormalized==='Завершено');
  } else if(type==='incoming'){
    if(m==='i-overdue') out=out.filter(isIOverdue);
    else if(m==='i-due7') out=out.filter(isIDue7);
    else if(m==='i-done') out=out.filter(r=>r.executionStatusNormalized==='Выполнено');
    if(state.filters.tab==='active') out=out.filter(isIncUnfinished);
    else if(state.filters.tab==='overdue') out=out.filter(isIOverdue);
    else if(state.filters.tab==='done') out=out.filter(r=>r.executionStatusNormalized==='Выполнено');
  }
  return out;
}

function getAttentionList(){
  const items=[];
  applyCommonFilters(state.protocols,'protocol').forEach(r=>{
    if(r.controlStatusNormalized==='Снят с контроля') return;
    let signal=null,prio=99;
    if(isProtoOverdue(r)){ signal='Просрочено'; prio=1; }
    else {
      const d=daysBetween(r.deadlineDate, state.referenceDate);
      if(d===0){signal='Сегодня';prio=2;}
      else if(d>0&&d<=3){signal='До 3 дней';prio=3;}
      else if(d>3&&d<=7){signal='До 7 дней';prio=4;}
    }
    if(signal) items.push({type:'protocol',title:r.assignmentText||r.protocol,responsible:r.responsibleRaw,department:r.department,deadline:formatDate(r.deadlineDate),signal,prio,record:r});
  });
  applyCommonFilters(state.eOtinish,'eotinish').forEach(r=>{
    if(r.executionStatusNormalized!=='На исполнении') return;
    let signal=null,prio=99;
    if(r.daysRemaining!=null && r.daysRemaining<0){signal='Просрочено';prio=1;}
    else if(r.daysRemaining===0){signal='Сегодня';prio=2;}
    else if(r.daysRemaining>0&&r.daysRemaining<=3){signal='До 3 дней';prio=3;}
    else if(r.daysRemaining>3&&r.daysRemaining<=7){signal='До 7 дней';prio=4;}
    if(signal) items.push({type:'eotinish',title:r.summary||r.appealNumber,responsible:r.responsibleEmployee,department:r.department,deadline:formatDate(r.deadline),signal,prio,record:r});
  });
  applyCommonFilters(state.incoming,'incoming').forEach(r=>{
    if(r.executionStatusNormalized==='Выполнено') return;
    let signal=null,prio=99;
    if(r.daysRemaining!=null && r.daysRemaining<0){signal='Просрочено';prio=1;}
    else if(r.daysRemaining===0){signal='Сегодня';prio=2;}
    else if(r.daysRemaining>0&&r.daysRemaining<=3){signal='До 3 дней';prio=3;}
    else if(r.daysRemaining>3&&r.daysRemaining<=7){signal='До 7 дней';prio=4;}
    if(signal) items.push({type:'incoming',title:r.summary||r.registrationNumberAndDate,responsible:r.responsibleEmployee,department:r.department,deadline:formatDate(r.deadline),signal,prio,record:r});
  });
  return items.sort((a,b)=>a.prio-b.prio).slice(0,80);
}

function nextAction(r,type){
  if(type==='protocol'){
    if(isProtoOverdue(r)) return 'Представить результат';
    if(r.controlStatusNormalized==='На снятии с контроля') return 'Утвердить снятие';
    if(r.controlStatusNormalized==='Снят с контроля') return 'Результат подтверждён';
    return 'Проверить готовность';
  }
  if(type==='eotinish'){
    if(r.executionStatusNormalized==='Завершено') return 'Результат подтверждён';
    if(r.daysRemaining!=null && r.daysRemaining<0) return 'Проверить готовность ответа';
    return 'Проверить уведомление';
  }
  if(r.executionStatusNormalized==='Выполнено') return 'Результат подтверждён';
  if(r.daysRemaining!=null && r.daysRemaining<0) return 'Уточнить результат';
  return 'Уточнить исполнение';
}

const DB_NAME='vzhdo-dashboard-v2';
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains('datasets')) req.result.createObjectStore('datasets'); };
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
async function saveToIDB(){
  try{
    const db=await openDB();
    const tx=db.transaction('datasets','readwrite');
    tx.objectStore('datasets').put({protocols:state.protocols,eOtinish:state.eOtinish,incoming:state.incoming,structure:state.structure,meta:state.meta,savedAt:new Date().toISOString()},'main');
  }catch(e){ console.warn(e); }
}
async function loadFromIDB(){
  try{
    const db=await openDB();
    const tx=db.transaction('datasets','readonly');
    const req=tx.objectStore('datasets').get('main');
    return await new Promise(r=>{ req.onsuccess=()=>r(req.result||null); req.onerror=()=>r(null); });
  }catch{ return null; }
}

async function handleFile(file, type){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array', cellDates:true});
  if(type==='structure'){
    const result=parseStructure(wb);
    const staged=result.employees;
    state.structure=staged;
    state.meta.structure={fileName:file.name,sheetName:result.sheetName,validCount:result.validCount,loadedAt:new Date().toISOString(),bundled:false};
    reenrichAll();
  } else if(type==='protocols'){
    const result=parseProtocols(wb, state.structure);
    state.protocols=result.records;
    state.meta.protocols={fileName:file.name,sheetName:result.sheetName,validCount:result.validCount,ignoredCount:result.ignoredCount,loadedAt:new Date().toISOString()};
  } else if(type==='eotinish'){
    const result=parseEOtinish(wb, state.structure);
    state.eOtinish=result.records;
    state.meta.eOtinish={fileName:file.name,sheetName:result.sheetName,validCount:result.validCount,ignoredCount:result.ignoredCount,loadedAt:new Date().toISOString()};
  } else if(type==='incoming'){
    const result=parseIncoming(wb, state.structure);
    state.incoming=result.records;
    state.meta.incoming={fileName:file.name,sheetName:result.sheetName,validCount:result.validCount,ignoredCount:result.ignoredCount,loadedAt:new Date().toISOString()};
  }
  state.dataLoaded=state.protocols.length+state.eOtinish.length+state.incoming.length>0;
  await saveToIDB();
  render();
}

function reenrichAll(){
  state.protocols=state.protocols.map(r=>{
    const en=mapEmployeeToStructure(r.responsiblePersons?.[0]||r.responsibleRaw, state.structure);
    return {...r,...en};
  });
  state.eOtinish=state.eOtinish.map(r=>{
    const en=mapEmployeeToStructure(r.responsibleEmployee, state.structure);
    return {...r, department:r.department && r.department!=='Не определено'?r.department:en.department, departmentHead:en.departmentHead, curator:en.curator};
  });
  state.incoming=state.incoming.map(r=>{
    const en=mapEmployeeToStructure(r.responsibleEmployee, state.structure);
    return {...r, department:r.department && r.department!=='Не определено'?r.department:en.department, departmentHead:en.departmentHead, curator:en.curator};
  });
}

window.navigate=function(page, keepMetric){
  state.activePage=page;
  if(!keepMetric) state.selectedMetric=null;
  if(page==='eotinish' && state.filters.tab==null && !state.selectedMetric) state.filters.tab='active';
  if(page!=='eotinish' && page!=='incoming') state.filters.tab=null;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.page===page);
    el.classList.toggle('text-slate-300', el.dataset.page!==page);
  });
  render();
};
window.selectMetric=function(key){
  const keep=state.selectedMetric===key?null:key;
  state.selectedMetric=keep;
  if(key.startsWith('p-') && state.activePage!=='protocols'){ navigate('protocols', true); scrollTable(); return; }
  if(key.startsWith('e-') && state.activePage!=='eotinish'){ state.filters.tab=null; navigate('eotinish', true); scrollTable(); return; }
  if(key.startsWith('i-') && state.activePage!=='incoming'){ state.filters.tab=null; navigate('incoming', true); scrollTable(); return; }
  render(); scrollTable();
};
function scrollTable(){ setTimeout(()=>{ document.getElementById('data-table')?.scrollIntoView({behavior:'smooth',block:'start'}); }, 50); }
window.setFilter=function(k,v){ state.filters[k]=v; if(k==='tab') state.selectedMetric=null; render(); };
window.setPeriodPreset=function(v){
  state.filters.periodPreset=v;
  const now=state.referenceDate;
  const start=new Date(now), end=new Date(now);
  if(v==='ALL'){ state.filters.dateStart=null; state.filters.dateEnd=null; }
  else if(v==='today'){ state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  else if(v==='7'){ start.setDate(start.getDate()-7); state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  else if(v==='30'){ start.setDate(start.getDate()-30); state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  else if(v==='month'){ start.setDate(1); state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  else if(v==='prevmonth'){ start.setMonth(start.getMonth()-1,1); end.setDate(0); state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  else if(v==='quarter'){ const q=Math.floor(start.getMonth()/3)*3; start.setMonth(q,1); state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  else if(v==='year'){ start.setMonth(0,1); state.filters.dateStart=iso(start); state.filters.dateEnd=iso(end); }
  render();
};
function iso(d){ return d.toISOString().slice(0,10); }
window.resetFilters=function(){ state.filters=emptyFilters(); state.selectedMetric=null; render(); };
window.onFileSelected=async function(ev,type){
  const file=ev.target.files[0]; if(!file) return;
  try{ await handleFile(file,type); alert('Файл успешно загружен.'); }
  catch(e){ console.error(e); alert('Файл не загружен. Текущие рабочие данные сохранены.\n'+e.message); }
  ev.target.value='';
};
window.clearData=async function(){
  if(!confirm('Вы действительно хотите удалить локально сохранённые данные дашборда?')) return;
  state.protocols=[]; state.eOtinish=[]; state.incoming=[];
  state.structure=[];
  state.meta={protocols:null,eOtinish:null,incoming:null,structure:null};
  state.dataLoaded=false;
  try{ const db=await openDB(); db.transaction('datasets','readwrite').objectStore('datasets').delete('main'); }catch{}
  render();
};
window.exportVisible=function(type){
  const base=applyCommonFilters(type==='protocol'?state.protocols:type==='eotinish'?state.eOtinish:state.incoming, type==='protocol'?'protocol':type);
  const rows=applyMetricAndTab(base, type==='protocol'?'protocol':type);
  const ws=XLSX.utils.json_to_sheet(rows.map(r=>{
    const o={...r}; delete o.id; return o;
  }));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'list');
  XLSX.writeFile(wb,'vzhdo-export.xlsx');
};

function render(){
  const el=document.getElementById('page-content');
  if(!state.dataLoaded && state.activePage!=='upload'){
    el.innerHTML=`<div class="flex flex-col items-center justify-center py-20 text-center">
      <i data-lucide="database" class="w-16 h-16 text-slate-300 mb-4"></i>

      <p class="text-slate-500 mb-6 max-w-md">Положите Структура.xlsx в корень GitHub-репозитория и загрузите здесь файлы 1.xlsx, 2.xlsx и 3.xlsx.</p>
      <button onclick="navigate('upload')" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg">Перейти к загрузке</button></div>`;
  } else {
    if(state.activePage==='overview') el.innerHTML=renderOverview();
    else if(state.activePage==='protocols') el.innerHTML=renderProtocols();
    else if(state.activePage==='eotinish') el.innerHTML=renderEOtinish();
    else if(state.activePage==='incoming') el.innerHTML=renderIncoming();
    else el.innerHTML=renderUpload();
  }
  lucide.createIcons();
}

document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.page)));
async function loadStructureFromRepo(){
  for(const url of STRUCTURE_URLS){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok) continue;
      const buf=await res.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const result=parseStructure(wb);
      state.structure=result.employees;
      state.meta.structure={fileName:'Структура.xlsx',sheetName:result.sheetName,validCount:result.validCount,loadedAt:new Date().toISOString(),source:'repo'};
      reenrichAll();
      await saveToIDB();
      return true;
    }catch(e){ console.warn('structure fetch', url, e); }
  }
  return false;
}
(async function init(){
  const saved=await loadFromIDB();
  if(saved){
    state.protocols=saved.protocols||[];
    state.eOtinish=saved.eOtinish||[];
    state.incoming=saved.incoming||[];
    state.structure=saved.structure||[];
    state.meta=saved.meta||state.meta;
    state.dataLoaded=state.protocols.length+state.eOtinish.length+state.incoming.length>0;
  }
  await loadStructureFromRepo();
  render();
})();
